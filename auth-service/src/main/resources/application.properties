spring.application.name=auth-service

server.port=8084

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:mysql://localhost:3306/auth_db
spring.datasource.username=root
spring.datasource.password=Mysql@2006

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=ArchivaliaSecretKeyForJwtAuthentication2026
jwt.expiration=86400000
# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Textbee SMS Configuration
textbee.api.url=https://api.textbee.dev/api/v1/gateway/send-sms
textbee.api.key=${TEXTBEE_API_KEY}
textbee.device.id=${TEXTBEE_DEVICE_ID}