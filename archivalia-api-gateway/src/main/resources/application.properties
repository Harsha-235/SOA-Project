spring.application.name=archivalia-api-gateway

server.port=8080

# Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Auth Service Route
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

# Book Service Route
spring.cloud.gateway.server.webmvc.routes[1].id=book-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://BOOK-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/books/**
# Borrow Service Route
spring.cloud.gateway.server.webmvc.routes[2].id=borrow-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://BORROW-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/borrows/**

spring.cloud.gateway.server.webmvc.routes[3].id=fine-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://FINE-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/fines/**
